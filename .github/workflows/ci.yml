# CI: lint, format, types, tests (PROPOSAL §5, B1.5, docs/TOOLCHAIN.md).
# Runs `make check` on push and pull request. Python 3.12, tools from uv.
name: ci
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: rebuild
          POSTGRES_DB: rmi
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      RMI_TEST_ADMIN_DSN: postgresql://rebuild@localhost:5432/rmi
      RMI_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.22"
      - name: Run make check
        run: make check
