[project]
name = "rmi-core"
version = "0.0.0"
description = "rmi-platform-next core (module contract, services)"
requires-python = ">=3.12"
dependencies = ["sqlalchemy[asyncio]>=2.0", "asyncpg>=0.30", "alembic>=1.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rmi_core"]
