[project]
name = "rmi-module-hello-friend"
version = "0.1.0"
description = "hello_friend: uses seam hello.greeting; works without it"
requires-python = ">=3.12"
dependencies = ["rmi-core"]

[project.entry-points."rmi.modules"]
hello_friend = "modules.hello_friend.manifest:manifest"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The module is the folder modules/hello/, imported as `modules.hello` from the repo root; the
# editable install puts the repo root on the path (this also makes `contracts` importable).
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"." = "modules/hello_friend"

[tool.hatch.build]
dev-mode-dirs = ["../.."]

[tool.uv.sources]
rmi-core = { workspace = true }
